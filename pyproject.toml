[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carexp"
version = "0.1.0"
description = "Expiration-aware scheduling for remote driving (CarRacing)"
requires-python = ">=3.10"
dependencies = [
    "gymnasium[box2d]>=1.0",
    "numpy",
    "pyyaml",
    "tqdm",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
